    <section class="contact">

        <h1>Contact Us</h1>
        <p class="subtitle">
            We'd love to hear from you! Send us your questions, feedback, or inquiries.
        </p>

        <div class="contact-container"><div class="contact-form">

                <form id="contact-form">

                    <input type="text" id="contact-name" placeholder="Your Name" required>

                    <input type="email" id="contact-email" placeholder="Your Email" required>

                    <input type="text" id="contact-subject" placeholder="Subject">

                    <textarea rows="6" id="contact-message" placeholder="Your Message"></textarea>

                    <button type="submit">Send Message</button>

                </form>

            </div>


            <div class="contact-info">

                <h2>Get In Touch</h2>

                <p><strong>📞 Phone</strong><br>
                    +91 97874 56512</p>

                <p><strong>📧 Email</strong><br>
                    coconutstore@gmail.com</p>

                <p><strong>🕒 Working Hours</strong><br>
                    Monday - Saturday<br>
                    9:00 AM - 6:00 PM</p>

            </div>

        </div>

    </section>






    <script src="collection.js"></script>
    <script src="index.js"></script>
    <script>
        document.getElementById("contact-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById("contact-name").value,
                email: document.getElementById("contact-email").value,
                subject: document.getElementById("contact-subject").value,
                message: document.getElementById("contact-message").value
            };
            const res = await fetch("/api/contact", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alert(data.message || data.error);
            if (res.ok) this.reset();
        });
    </script>
